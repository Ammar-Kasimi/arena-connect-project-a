<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section class="p-profil-card">
        <div class="p-banner">
            <img src="./imagesA/banner3.png" alt="">
        </div>
        <div class="p-profile-pic">
            <div class="p-pic-size"></div>
        </div>

        <div class="p-under-banner"> </div>
        <p class="p-followers">followers:</p>
        <p class="p-follows">follows:</p>
        <p class="p-desc"><strong>Description</strong></p>
        <p class="name"> Name</p>
        <p class="madeIn">made in </p>

    </section>
    <section class="p-section2 spaceUp">
        <div class="p-frame1"></div>
        <div class="p-frame2"></div>
        <p class="p-jeu-favori"> Jeu Favori:</p>
        <p class="p-game">Valorant</p>
        <div>
            <img src="p-rank" alt="">
        </div>

        <p class="p-mvp">mvp ratio :</p>
        <p class="p-wins">Win ratio:</p>
        <div class="flexdiv">
            <div class="p-mvp-bar"></div>
            <div class="p-mvp-circle"></div>
            <p class="percentage">42%</p>
        </div>
        <div class="flexdiv2">
            <div class="p-win-bar"></div>
            <div class="p-win-circle"></div>
            <p class="percentage">65%</p>
        </div>

    </section>




</body>

</html>
